server:
  port: 8093
  error:
    include-message: always

spring:
  application:
    name: shopping-service

  datasource:
    url: jdbc:mysql://localhost:3306/shopping_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8099/eureka/ 